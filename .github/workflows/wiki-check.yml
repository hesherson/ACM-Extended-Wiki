name: Wiki build
on:
  push:
    branches: [main, wiki/reference-refresh]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the wiki
        run: python3 build.py
      - name: Check pages, anchors and assets
        run: python3 scripts/check_wiki.py
      - name: Check browser script syntax
        run: |
          node --check src/reference.js
          node --check src/slideshow.js
          node --check src/chart-readouts.js
          node --check src/suction-guide.js
          node --check src/capnography.js
          node --check src/languages.js
          node --check src/rhythm-waveforms.js
          node --check src/chest-seal.js

      - name: Install browser checks
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile behavior
        run: |
          node scripts/check_browser.mjs
          node scripts/check_visual_update.mjs
          node scripts/check_reference_expansion.mjs
          node scripts/check_chest_rhythms.mjs
